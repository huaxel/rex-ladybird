name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua, Python and shellcheck
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install luajit shellcheck
          else
            sudo apt-get update
            sudo apt-get install -y luajit shellcheck
          fi
      - name: Run the checks
        run: bash test/run.sh
